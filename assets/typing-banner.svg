<svg width="480" height="190" viewBox="0 0 480 190" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clipL1">
      <rect x="0" y="54" width="0" height="24">
        <animate attributeName="width" from="0" to="210" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipL2">
      <rect x="0" y="82" width="0" height="24">
        <animate attributeName="width" from="0" to="80" dur="0.5s" begin="1.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipL3">
      <rect x="0" y="110" width="0" height="24">
        <animate attributeName="width" from="0" to="320" dur="1.3s" begin="2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipL4">
      <rect x="0" y="138" width="0" height="24">
        <animate attributeName="width" from="0" to="230" dur="1s" begin="3.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="0.5" y="0.5" width="479" height="189" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- title bar -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="240" y="24" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b949e">moaaz@life</text>
  <line x1="0" y1="36" x2="480" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- line 1: whoami -->
  <g clip-path="url(#clipL1)">
    <text x="20" y="70" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7ee787">moaaz@dev:~$ whoami</text>
  </g>

  <!-- line 2: Moaaz -->
  <g clip-path="url(#clipL2)">
    <text x="20" y="98" font-family="Menlo, Consolas, monospace" font-size="16" fill="#c9d1d9">Moaaz</text>
  </g>

  <!-- line 3: how do you cook -->
  <g clip-path="url(#clipL3)">
    <text x="20" y="126" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7ee787">moaaz@dev:~$ how do you cook?</text>
  </g>

  <!-- line 4: Full-Stack Developer -->
  <g clip-path="url(#clipL4)">
    <text x="20" y="154" font-family="Menlo, Consolas, monospace" font-size="16" fill="#c9d1d9">Full-Stack Developer</text>
  </g>

  <!-- blinking cursor after everything finishes -->
  <rect x="20" y="140" width="8" height="18" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="4.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.5s" repeatCount="indefinite"/>
    <animate attributeName="x" from="20" to="228" dur="0.01s" begin="4.5s" fill="freeze"/>
  </rect>
</svg>
