<svg width="640" height="230" viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clipPrompt">
      <rect x="0" y="52" width="0" height="24">
        <animate attributeName="width" from="0" to="330" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipAscii">
      <rect x="0" y="84" width="0" height="118">
        <animate attributeName="width" from="0" to="620" dur="1.5s" begin="1.3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipReady">
      <rect x="0" y="206" width="0" height="20">
        <animate attributeName="width" from="0" to="260" dur="0.6s" begin="2.9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="0.5" y="0.5" width="639" height="229" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- title bar -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="320" y="24" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#8b949e">moaaz@robinfood — zsh</text>
  <line x1="0" y1="36" x2="640" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- typed prompt -->
  <g clip-path="url(#clipPrompt)">
    <text x="20" y="68" font-family="Menlo, Consolas, monospace" font-size="16" fill="#7ee787" xml:space="preserve">moaaz@dev:~$ whoami</text>
  </g>
  <rect x="330" y="52" width="8" height="18" fill="#7ee787">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.35;0.65;1" dur="0.9s" begin="0.2s" repeatCount="2"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.01s" begin="1.2s" fill="freeze"/>
  </rect>

  <!-- ascii art reveal -->
  <g clip-path="url(#clipAscii)">
    <text x="20" y="102" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#58a6ff" xml:space="preserve">
      <tspan x="20" dy="0">   ________  ____    __        ______________   ________ __</tspan>
      <tspan x="20" dy="19">  / ____/ / / / /   / /       / ___/_  __/   | / ____/ //_/</tspan>
      <tspan x="20" dy="19"> / /_  / / / / /   / /  ______\__ \ / / / /| |/ /   / ,&lt;  </tspan>
      <tspan x="20" dy="19">/ __/ / /_/ / /___/ /__/_____/__/ // / / ___ / /___/ /| |  </tspan>
      <tspan x="20" dy="19">/_/    \____/_____/_____/    /____//_/ /_/  |_\____/_/ |_| </tspan>
    </text>
  </g>

  <!-- ready prompt after typing finishes -->
  <g clip-path="url(#clipReady)">
    <text x="20" y="221" font-family="Menlo, Consolas, monospace" font-size="14" fill="#7ee787" xml:space="preserve">moaaz@dev:~$ Full-Stack Developer</text>
  </g>
  <rect x="20" y="207" width="7" height="16" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="2.9s" fill="freeze"/>
  </rect>
  <rect x="256" y="207" width="7" height="16" fill="#7ee787" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" begin="3.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
